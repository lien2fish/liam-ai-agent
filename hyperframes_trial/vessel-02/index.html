<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>這片光，其實是漁船</title>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/brand.js"></script>
    <style>
      /* 衛星影像當「引用的資料來源」呈現：框起來、標出處。
         不做滿版背景——原圖只有 720×480，滿版要放大 2 倍以上；
         而且 NASA 影像不得暗示為商品背書，框住並標來源才站得住。 */
      #frame {
        position: absolute; left: 110px; top: 590px; width: 860px; height: 573px;
        border-radius: 20px; overflow: hidden; border: 3px solid #2f5c78;
      }
      /* 只做輕微提亮讓船燈在手機上讀得出來，不裁切、不改內容 */
      #sat {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
        filter: brightness(1.18) contrast(1.06);
      }
      #credit {
        position: absolute; left: 70px; right: 70px; top: 1196px; text-align: center;
        font-size: 30px; color: #6c8298; letter-spacing: 0.03em; line-height: 1.5;
      }

      .stat-num {
        position: absolute; left: 0; right: 0; text-align: center;
        font-size: 150px; font-weight: 700; color: var(--gold); letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vessel02"
      data-start="0"
      data-duration="27.4"
      data-fps="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="27.4" data-track-index="0"></div>

      <!-- 衛星影像橫跨前四段，緩慢推近不重置 -->
      <div id="photo" class="clip" data-start="0" data-duration="16.7" data-track-index="1">
        <div class="sin" id="photo-in">
          <div id="frame"><img id="sat" src="assets/nasa_malvinas_lights.jpg" alt="" /></div>
          <div id="credit">
            NASA Earth Observatory · Suomi NPP / VIIRS · 2012.04.17–25
          </div>
        </div>
      </div>

      <!-- 1. HOOK 0–3.4 -->
      <section id="s1" class="clip" data-start="0" data-duration="3.7" data-track-index="2">
        <div class="sin" id="s1-in">
          <div class="stack" id="s1-text" style="top: 1320px">
            <span class="line l-hook">這片光</span>
            <span class="line l-hook gold">其實是漁船</span>
          </div>
        </div>
      </section>

      <!-- 2. 3.4–7.6 -->
      <section id="s2" class="clip" data-start="3.7" data-duration="4.2" data-track-index="3">
        <div class="sin" id="s2-in">
          <div class="stack" id="s2-text" style="top: 1340px">
            <span class="line l-body">這是從太空</span>
            <span class="line l-body cold">拍下來的</span>
          </div>
        </div>
      </section>

      <!-- 3. 7.6–12.2 -->
      <section id="s3" class="clip" data-start="7.9" data-duration="4.6" data-track-index="4">
        <div class="sin" id="s3-in">
          <div class="stack" id="s3-text" style="top: 1340px">
            <span class="line l-body">南大西洋</span>
            <span class="line l-body">離岸三百公里的海面</span>
          </div>
        </div>
      </section>

      <!-- 4. 12.2–16.4 -->
      <section id="s4" class="clip" data-start="12.5" data-duration="4.2" data-track-index="5">
        <div class="sin" id="s4-in">
          <div class="stack" id="s4-text" style="top: 1340px">
            <span class="line l-body">會出現一座</span>
            <span class="line l-hook gold">光 之 城</span>
          </div>
        </div>
      </section>

      <!-- 5. STAT 16.4–20.8 -->
      <section id="s5" class="clip" data-start="16.7" data-duration="4.8" data-track-index="6">
        <div class="sin" id="s5-in">
          <div class="stack" id="s5-top" style="top: 620px">
            <span class="line l-body">那是魷釣船</span>
            <span class="line l-body">用強光把魷魚誘到表層</span>
          </div>
          <div class="stat-num" id="s5-num" style="top: 1060px">251,000</div>
          <div class="caption" id="s5-cap" style="top: 1290px">2020 年全球魷釣船的作業「船日」</div>
        </div>
      </section>

      <!-- 6. END 20.8–25.8 -->
      <section id="s6" class="clip" data-start="21.5" data-duration="5.9" data-track-index="7">
        <div class="sin" id="s6-in">
          <div class="stack" id="s6-a" style="top: 900px">
            <span class="line l-body dim">龜吼的棒受網也用集魚燈</span>
          </div>
          <div class="stack" id="s6-b" style="top: 1060px">
            <span class="line l-body">同樣的原理</span>
          </div>
          <div class="stack" id="s6-c" style="top: 1190px">
            <span class="line l-hook gold">不同的規模</span>
          </div>
        </div>
      </section>

      <!-- 旁白：zh-TW-YunJheNeural +8%，逐字沿用字卡內容 -->
      <audio id="vo-1" data-start="0.25" data-duration="2.32" src="audio/s1.mp3"></audio>
      <audio id="vo-2" data-start="3.95" data-duration="1.76" src="audio/s2.mp3"></audio>
      <audio id="vo-3" data-start="8.15" data-duration="2.96" src="audio/s3.mp3"></audio>
      <audio id="vo-4" data-start="12.75" data-duration="1.52" src="audio/s4.mp3"></audio>
      <audio id="vo-5" data-start="16.95" data-duration="4.24" src="audio/s5.mp3"></audio>
      <audio id="vo-6" data-start="21.75" data-duration="5.36" src="audio/s6.mp3"></audio>
    </div>

    <script>
      brandChrome("bg");

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 影像：橫跨前四段的一次連續推近
      tl.fromTo("#frame", { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo("#sat", { scale: 1 }, { scale: 1.08, duration: 16.7, ease: "none" }, 0);
      tl.fromTo("#credit", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8 }, 0.6);
      tl.to("#photo-in", { opacity: 0, duration: 0.4, ease: "power1.in" }, 16.3);
      tl.set("#photo-in", { opacity: 0 }, 16.7);

      // 1. HOOK：t=0 就要完整可讀（第一格＝Shorts 縮圖）
      tl.fromTo("#s1-text", { scale: 1 }, { scale: 1.035, duration: 3.7, ease: "none" }, 0);
      tl.to("#s1-in", { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.35);
      tl.set("#s1-in", { opacity: 0 }, 3.7);

      // 2
      tl.fromTo("#s2-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.8);
      tl.to("#s2-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 7.6);
      tl.set("#s2-in", { opacity: 0 }, 7.9);

      // 3
      tl.fromTo("#s3-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 8);
      tl.to("#s3-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 12.2);
      tl.set("#s3-in", { opacity: 0 }, 12.5);

      // 4
      tl.fromTo("#s4-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 12.6);
      tl.to("#s4-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 16.4);
      tl.set("#s4-in", { opacity: 0 }, 16.7);

      // 5. STAT
      tl.fromTo("#s5-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 16.8);
      tl.fromTo("#s5-num", { autoAlpha: 0, scale: 0.82 }, { autoAlpha: 1, scale: 1, duration: 0.9, ease: "back.out(1.6)" }, 17.7);
      tl.fromTo("#s5-cap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 18.5);
      tl.to("#s5-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 21.2);
      tl.set("#s5-in", { opacity: 0 }, 21.5);

      // 6. END
      tl.fromTo("#s6-a", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 21.6);
      tl.fromTo("#s6-b", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 22.4);
      tl.fromTo("#s6-c", { autoAlpha: 0, y: 34, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 23.2);

      window.__timelines["vessel02"] = tl;
    </script>
  </body>
</html>
