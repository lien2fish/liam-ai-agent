<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>生魚片鮪魚要凍到零下 60 度</title>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/brand.js"></script>
    <style>
      /* 橫向溫度尺：780px 對應 0°C～−60°C ⇒ x = |溫度|/60 × 780
         −18°C → 234px　−60°C → 780px
         ⚠️ 這些是相對 .tscale 的座標，不要填絕對頁面座標 */
      .tscale { position: absolute; left: 150px; width: 780px; height: 130px; }
      .tbar {
        position: absolute; left: 0; top: 60px; width: 780px; height: 16px;
        border-radius: 8px; background: #1e3042;
      }
      .tfill-cold {
        position: absolute; left: 0; top: 60px; width: 234px; height: 16px;
        border-radius: 8px; background: #34566f;
      }
      .tfill-deep {
        position: absolute; left: 234px; top: 60px; width: 546px; height: 16px;
        border-radius: 8px; background: var(--gold);
      }
      .tlabel { position: absolute; top: 4px; font-size: 34px; color: var(--dim); }
      .tmark  { position: absolute; top: 82px; left: -13px; width: 26px; height: 22px; }

      /* 鮪魚肉塊：中心 (540, 900)，600×380 */
      #slab {
        position: absolute; left: 240px; top: 710px; width: 600px; height: 380px;
        border-radius: 26px; overflow: hidden;
        background: #c6342e; border: 4px solid #e8c8a0;
      }
      #brown { position: absolute; inset: 0; background: #76482a; }
      #brownedge {
        position: absolute; left: 0; top: 0; width: 4px; height: 100%;
        background: #d2aa78;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="coldchain02"
      data-start="0"
      data-duration="25"
      data-fps="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>

      <!-- 1. HOOK 0–3.2 -->
      <section id="s1" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="sin" id="s1-in">
          <div class="xtal" id="x1" style="left: 240px; top: 480px; width: 600px; height: 600px; opacity: 0.2"></div>
          <div class="stack" id="s1-text" style="top: 800px">
            <span class="line l-hook">生魚片鮪魚</span>
            <span class="line l-hook gold">要凍到零下 60 度</span>
          </div>
          <div class="tag" id="s1-tag" style="top: 1180px">超 低 溫 的 理 由</div>
        </div>
      </section>

      <!-- 2. DEEPCOLD 3.2–7.2 -->
      <section id="s2" class="clip" data-start="3.2" data-duration="4" data-track-index="2">
        <div class="sin" id="s2-in">
          <div class="stack" id="s2-top" style="top: 480px">
            <span class="line l-body">一般冷凍是 −18°C</span>
          </div>
          <div class="tscale" id="sc-a" style="top: 850px"></div>
          <div class="stack" id="s2-bottom" style="top: 1250px">
            <span class="line l-body gold">這裡要再往下三倍</span>
          </div>
        </div>
      </section>

      <!-- 鮪魚肉塊自成一層，橫跨場景 3～4（褐變在場景 4 才發生） -->
      <div id="meat" class="clip" data-start="7.2" data-duration="9.5" data-track-index="3">
        <div class="sin" id="meat-in">
          <div id="slab"><div id="brown"></div><div id="brownedge"></div></div>
        </div>
      </div>

      <!-- 3. MYO 7.2–12.2 -->
      <section id="s3" class="clip" data-start="7.2" data-duration="5" data-track-index="3">
        <div class="sin" id="s3-in">
          <div class="tag" id="s3-tag" style="top: 440px">鮪 魚 的 紅 色</div>
          <div class="caption" id="s3-cap" style="top: 1120px">氧合肌紅蛋白 ＝ 鮮紅</div>
          <div class="stack" id="s3-text" style="top: 1330px">
            <span class="line l-body">來自</span>
            <span class="line l-body cold">肌紅蛋白</span>
          </div>
        </div>
      </section>

      <!-- 4. MYO2 12.2–16.7（與 s3 共用同一塊肉，接著褐變） -->
      <section id="s4" class="clip" data-start="12.2" data-duration="4.5" data-track-index="4">
        <div class="sin" id="s4-in">
          <div class="tag warn" id="s4-tag" style="top: 440px">它 會 慢 慢 氧 化</div>
          <div class="caption warn" id="s4-cap" style="top: 1120px">變性肌紅蛋白 ＝ 褐色</div>
          <div class="stack" id="s4-text" style="top: 1330px">
            <span class="line l-body">紅色</span>
            <span class="line l-body warn">就轉成褐色</span>
          </div>
        </div>
      </section>

      <!-- 5. DEEPCOLD2 16.7–20.7 -->
      <section id="s5" class="clip" data-start="16.7" data-duration="4" data-track-index="5">
        <div class="sin" id="s5-in">
          <div class="stack" id="s5-top" style="top: 480px">
            <span class="line l-body">只有 −60°C 以下</span>
          </div>
          <div class="tscale" id="sc-b" style="top: 850px"></div>
          <div class="stack" id="s5-bottom" style="top: 1250px">
            <span class="line l-body gold">能真正把它停住</span>
          </div>
        </div>
      </section>

      <!-- 6. END 20.7–25.0 -->
      <section id="s6" class="clip" data-start="20.7" data-duration="4.3" data-track-index="6">
        <div class="sin" id="s6-in">
          <div class="xtal" id="x6" style="left: 340px; top: 560px; width: 400px; height: 400px; opacity: 0.28"></div>
          <div class="stack" id="s6-a" style="top: 940px">
            <span class="line l-body dim">日本處理的鮪魚</span>
          </div>
          <div class="stack" id="s6-b" style="top: 1090px">
            <span class="line l-hook gold">約八成走超低溫</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      brandChrome("bg");
      document.getElementById("x1").innerHTML = crystalMarkup(2.4);
      document.getElementById("x6").innerHTML = crystalMarkup(3);

      // 兩個場景各一支溫度尺；deep=true 的那支多一段 −18→−60 的金色填充
      function buildScale(id, deep) {
        const host = document.getElementById(id);
        const marker =
          '<svg viewBox="0 0 26 22" width="100%" height="100%">' +
          '<polygon points="13,0 0,22 26,22" fill="#d6a85c"/></svg>';
        host.innerHTML =
          '<div class="tbar"></div>' +
          '<div class="tfill-cold" id="' + id + '-cold"></div>' +
          (deep ? '<div class="tfill-deep" id="' + id + '-deep"></div>' : "") +
          '<div class="tlabel" style="left: 0">0°C</div>' +
          '<div class="tlabel" style="left: 188px">−18°C</div>' +
          '<div class="tlabel' + (deep ? " gold" : "") + '" style="left: 642px">−60°C</div>' +
          '<div class="tmark" id="' + id + '-mark">' + marker + "</div>";
      }
      buildScale("sc-a", false);
      buildScale("sc-b", true);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. HOOK：t=0 就要完整可讀
      tl.fromTo("#x1", { rotation: 5, scale: 0.95 }, { rotation: -5, scale: 1.05, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#s1-text", { scale: 1 }, { scale: 1.04, duration: 3.2, ease: "none" }, 0);
      tl.fromTo("#s1-tag", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.to("#s1-in", { opacity: 0, duration: 0.35, ease: "power1.in" }, 2.85);
      tl.set("#s1-in", { opacity: 0 }, 3.2);

      // 2. DEEPCOLD：指標推到 −18°C
      tl.fromTo("#s2-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.25);
      tl.fromTo("#sc-a .tbar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 3.5);
      tl.fromTo("#sc-a .tlabel", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.1 }, 4.0);
      tl.fromTo("#sc-a-cold", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 4.3);
      tl.fromTo("#sc-a-mark", { x: 0, autoAlpha: 0 }, { x: 234, autoAlpha: 1, duration: 1.0, ease: "power2.inOut" }, 4.3);
      tl.fromTo("#s2-bottom", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.4);
      tl.to("#s2-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 6.9);
      tl.set("#s2-in", { opacity: 0 }, 7.2);

      // 3. MYO：鮮紅的肉，褐變還沒開始
      tl.set("#brown", { scaleX: 0, transformOrigin: "0% 50%" }, 0);
      tl.set("#brownedge", { x: 0, autoAlpha: 0 }, 0);
      tl.fromTo("#s3-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 7.3);
      tl.fromTo("#slab", { autoAlpha: 0, scale: 0.93 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 7.5);
      tl.fromTo("#s3-cap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 8.4);
      tl.fromTo("#s3-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 9.0);
      tl.to("#s3-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 11.9);
      tl.set("#s3-in", { opacity: 0 }, 12.2);

      // 4. MYO2：褐變由左往右推進
      tl.fromTo("#s4-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 12.3);
      tl.to("#brown", { scaleX: 1, duration: 2.6, ease: "power1.inOut" }, 12.6);
      tl.to("#brownedge", { x: 596, autoAlpha: 1, duration: 2.6, ease: "power1.inOut" }, 12.6);
      tl.fromTo("#s4-cap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 13.4);
      tl.fromTo("#s4-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 14.0);
      tl.to("#s4-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 16.4);
      tl.set("#s4-in", { opacity: 0 }, 16.7);
      tl.to("#meat-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 16.4);
      tl.set("#meat-in", { opacity: 0 }, 16.7);

      // 5. DEEPCOLD2：金色段一路推到 −60°C
      tl.fromTo("#s5-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 16.75);
      tl.set("#sc-b .tbar", { scaleX: 1 }, 16.7);
      tl.fromTo("#sc-b .tlabel", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.1 }, 16.9);
      tl.fromTo("#sc-b-cold", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 17.1);
      tl.fromTo("#sc-b-deep", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 17.6);
      tl.fromTo("#sc-b-mark", { x: 234, autoAlpha: 1 }, { x: 780, duration: 1.4, ease: "power2.inOut" }, 17.6);
      tl.fromTo("#s5-bottom", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 19.0);
      tl.to("#s5-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 20.4);
      tl.set("#s5-in", { opacity: 0 }, 20.7);

      // 6. END
      tl.fromTo("#x6", { scale: 0.72, rotation: -10 }, { scale: 1, rotation: 0, duration: 1.2, ease: "power3.out" }, 20.8);
      tl.fromTo("#s6-a", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 21.0);
      tl.fromTo("#s6-b", { autoAlpha: 0, y: 34, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 21.7);
      tl.to("#x6", { opacity: 0.13, duration: 1.6, ease: "sine.inOut" }, 22.3);

      window.__timelines["coldchain02"] = tl;
    </script>
  </body>
</html>
