<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>生魚片鮪魚要凍到零下 60 度</title>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/brand.js"></script>
    <style>
      /* 橫向溫度尺：780px 對應 0°C～−60°C ⇒ x = |溫度|/60 × 780
         −18°C → 234px　−60°C → 780px
         ⚠️ 這些是相對 .tscale 的座標，不要填絕對頁面座標 */
      .tscale { position: absolute; left: 150px; width: 780px; height: 130px; }
      .tbar {
        position: absolute; left: 0; top: 60px; width: 780px; height: 16px;
        border-radius: 8px; background: #1e3042;
      }
      .tfill-cold {
        position: absolute; left: 0; top: 60px; width: 234px; height: 16px;
        border-radius: 8px; background: #34566f;
      }
      .tfill-deep {
        position: absolute; left: 234px; top: 60px; width: 546px; height: 16px;
        border-radius: 8px; background: var(--gold);
      }
      .tlabel { position: absolute; top: 4px; font-size: 34px; color: var(--dim); }
      .tmark  { position: absolute; top: 82px; left: -13px; width: 26px; height: 22px; }

      /* 開場：冷凍鮪魚實拍當氛圍底。壓暗＋下半漸層，字才讀得出來，
         也讓它讀起來是「氣氛」而不是「這一塊就是我的貨」。 */
      #hero { position: absolute; inset: 0; overflow: hidden; }
      #hero img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block; filter: brightness(0.78) saturate(0.9);
      }
      #hero-veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg,
          rgba(4,14,24,0.55) 0%, rgba(4,14,24,0.25) 38%,
          rgba(4,14,24,0.86) 62%, rgba(4,14,24,0.97) 100%);
      }

      /* 鮪魚肉塊：中心 (540, 900)，600×380。
         紅→褐用兩張同源貼圖疊著淡入——同一張圖做色彩位移，完全對齊。
         ⚠️ 用整面淡入不是由左往右擦除：肉是從切面均勻氧化的，擦除是美術效果不是事實。 */
      #slab {
        position: absolute; left: 240px; top: 710px; width: 600px; height: 380px;
        border-radius: 26px; overflow: hidden; border: 4px solid #e8c8a0;
        background: #1a1010;
      }
      #slab img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="coldchain02"
      data-start="0"
      data-duration="29.1"
      data-fps="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="29.1" data-track-index="0"></div>

      <!-- 1. HOOK 0–3.2 -->
      <section id="s1" class="clip" data-start="0" data-duration="4.4" data-track-index="1">
        <div class="sin" id="s1-in">
          <div id="hero">
            <img id="hero-img" src="assets/frozen_tuna.jpg" alt="" />
            <div id="hero-veil"></div>
          </div>
          <div class="stack" id="s1-text" style="top: 1250px">
            <span class="line l-hook">生魚片鮪魚</span>
            <span class="line l-hook gold">要凍到零下 60 度</span>
          </div>
          <div class="tag" id="s1-tag" style="top: 1590px">超 低 溫 的 理 由</div>
        </div>
      </section>

      <!-- 2. DEEPCOLD 3.2–7.2 -->
      <section id="s2" class="clip" data-start="4.4" data-duration="5.5" data-track-index="2">
        <div class="sin" id="s2-in">
          <div class="stack" id="s2-top" style="top: 480px">
            <span class="line l-body">一般冷凍是 −18°C</span>
          </div>
          <div class="tscale" id="sc-a" style="top: 850px"></div>
          <div class="stack" id="s2-bottom" style="top: 1250px">
            <span class="line l-body gold">這裡要再往下三倍</span>
          </div>
        </div>
      </section>

      <!-- 鮪魚肉塊自成一層，橫跨場景 3～4（褐變在場景 4 才發生） -->
      <div id="meat" class="clip" data-start="9.9" data-duration="9.5" data-track-index="3">
        <div class="sin" id="meat-in">
          <div id="slab">
            <img id="tuna-fresh" src="assets/tuna_fresh.jpg" alt="" />
            <img id="tuna-brown" src="assets/tuna_brown.jpg" alt="" />
          </div>
        </div>
      </div>

      <!-- 3. MYO 7.2–12.2 -->
      <section id="s3" class="clip" data-start="9.9" data-duration="5" data-track-index="3">
        <div class="sin" id="s3-in">
          <div class="tag" id="s3-tag" style="top: 440px">鮪 魚 的 紅 色</div>
          <div class="caption" id="s3-cap" style="top: 1120px">氧合肌紅蛋白 ＝ 鮮紅</div>
          <div class="stack" id="s3-text" style="top: 1330px">
            <span class="line l-body">來自</span>
            <span class="line l-body cold">肌紅蛋白</span>
          </div>
        </div>
      </section>

      <!-- 4. MYO2 12.2–16.7（與 s3 共用同一塊肉，接著褐變） -->
      <section id="s4" class="clip" data-start="14.9" data-duration="4.5" data-track-index="4">
        <div class="sin" id="s4-in">
          <div class="tag warn" id="s4-tag" style="top: 440px">它 會 慢 慢 氧 化</div>
          <div class="caption warn" id="s4-cap" style="top: 1120px">變性肌紅蛋白 ＝ 褐色</div>
          <div class="stack" id="s4-text" style="top: 1330px">
            <span class="line l-body">紅色</span>
            <span class="line l-body warn">就轉成褐色</span>
          </div>
        </div>
      </section>

      <!-- 5. DEEPCOLD2 16.7–20.7 -->
      <section id="s5" class="clip" data-start="19.4" data-duration="4.9" data-track-index="5">
        <div class="sin" id="s5-in">
          <div class="stack" id="s5-top" style="top: 480px">
            <span class="line l-body">只有 −60°C 以下</span>
          </div>
          <div class="tscale" id="sc-b" style="top: 850px"></div>
          <div class="stack" id="s5-bottom" style="top: 1250px">
            <span class="line l-body gold">能真正把它停住</span>
          </div>
        </div>
      </section>

      <!-- 6. END 20.7–25.0 -->
      <section id="s6" class="clip" data-start="24.3" data-duration="4.8" data-track-index="6">
        <div class="sin" id="s6-in">
          <div class="xtal" id="x6" style="left: 340px; top: 560px; width: 400px; height: 400px; opacity: 0.28"></div>
          <div class="stack" id="s6-a" style="top: 940px">
            <span class="line l-body dim">日本處理的鮪魚</span>
          </div>
          <div class="stack" id="s6-b" style="top: 1090px">
            <span class="line l-hook gold">約八成走超低溫</span>
          </div>
        </div>
      </section>

      <!-- 旁白：zh-TW-YunJheNeural +8%，逐字沿用字卡內容 -->
      <audio id="vo-1" data-start="0.25" data-duration="3.84" src="audio/s1.mp3"></audio>
      <audio id="vo-2" data-start="4.65" data-duration="4.9" src="audio/s2.mp3"></audio>
      <audio id="vo-3" data-start="10.15" data-duration="4.01" src="audio/s3.mp3"></audio>
      <audio id="vo-4" data-start="15.15" data-duration="3.89" src="audio/s4.mp3"></audio>
      <audio id="vo-5" data-start="19.65" data-duration="4.3" src="audio/s5.mp3"></audio>
      <audio id="vo-6" data-start="24.55" data-duration="4.18" src="audio/s6.mp3"></audio>
    </div>

    <script>
      brandChrome("bg");
      document.getElementById("x1").innerHTML = crystalMarkup(2.4);
      document.getElementById("x6").innerHTML = crystalMarkup(3);

      // 兩個場景各一支溫度尺；deep=true 的那支多一段 −18→−60 的金色填充
      function buildScale(id, deep) {
        const host = document.getElementById(id);
        const marker =
          '<svg viewBox="0 0 26 22" width="100%" height="100%">' +
          '<polygon points="13,0 0,22 26,22" fill="#d6a85c"/></svg>';
        host.innerHTML =
          '<div class="tbar"></div>' +
          '<div class="tfill-cold" id="' + id + '-cold"></div>' +
          (deep ? '<div class="tfill-deep" id="' + id + '-deep"></div>' : "") +
          '<div class="tlabel" style="left: 0">0°C</div>' +
          '<div class="tlabel" style="left: 188px">−18°C</div>' +
          '<div class="tlabel' + (deep ? " gold" : "") + '" style="left: 642px">−60°C</div>' +
          '<div class="tmark" id="' + id + '-mark">' + marker + "</div>";
      }
      buildScale("sc-a", false);
      buildScale("sc-b", true);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. HOOK：t=0 就要完整可讀
      tl.fromTo("#hero-img", { scale: 1.03 }, { scale: 1.11, duration: 4.4, ease: "none" }, 0);
      tl.fromTo("#s1-text", { scale: 1 }, { scale: 1.04, duration: 4.4, ease: "none" }, 0);
      tl.fromTo("#s1-tag", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.to("#s1-in", { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.05);
      tl.set("#s1-in", { opacity: 0 }, 4.4);

      // 2. DEEPCOLD：指標推到 −18°C
      tl.fromTo("#s2-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.45);
      tl.fromTo("#sc-a .tbar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 4.7);
      tl.fromTo("#sc-a .tlabel", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.1 }, 5.2);
      tl.fromTo("#sc-a-cold", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 5.5);
      tl.fromTo("#sc-a-mark", { x: 0, autoAlpha: 0 }, { x: 234, autoAlpha: 1, duration: 1.0, ease: "power2.inOut" }, 5.5);
      tl.fromTo("#s2-bottom", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.6);
      tl.to("#s2-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 9.6);
      tl.set("#s2-in", { opacity: 0 }, 9.9);

      // 3. MYO：鮮紅的肉，褐變還沒開始
      tl.set("#tuna-brown", { opacity: 0 }, 0);
      tl.fromTo("#s3-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 10);
      tl.fromTo("#slab", { autoAlpha: 0, scale: 0.93 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 10.2);
      tl.fromTo("#s3-cap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 11.1);
      tl.fromTo("#s3-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 11.7);
      tl.to("#s3-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 14.6);
      tl.set("#s3-in", { opacity: 0 }, 14.9);

      // 4. MYO2：褐變由左往右推進
      tl.fromTo("#s4-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 15);
      tl.to("#tuna-brown", { opacity: 1, duration: 2.6, ease: "power1.inOut" }, 15.3);
      tl.fromTo("#s4-cap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 16.1);
      tl.fromTo("#s4-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 16.7);
      tl.to("#s4-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 19.1);
      tl.set("#s4-in", { opacity: 0 }, 19.4);
      tl.to("#meat-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 19.1);
      tl.set("#meat-in", { opacity: 0 }, 19.4);

      // 5. DEEPCOLD2：金色段一路推到 −60°C
      tl.fromTo("#s5-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 19.45);
      tl.set("#sc-b .tbar", { scaleX: 1 }, 19.4);
      tl.fromTo("#sc-b .tlabel", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.1 }, 19.6);
      tl.fromTo("#sc-b-cold", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 19.8);
      tl.fromTo("#sc-b-deep", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 20.3);
      tl.fromTo("#sc-b-mark", { x: 234, autoAlpha: 1 }, { x: 780, duration: 1.4, ease: "power2.inOut" }, 20.3);
      tl.fromTo("#s5-bottom", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 21.7);
      tl.to("#s5-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 24);
      tl.set("#s5-in", { opacity: 0 }, 24.3);

      // 6. END
      tl.fromTo("#x6", { scale: 0.72, rotation: -10 }, { scale: 1, rotation: 0, duration: 1.2, ease: "power3.out" }, 24.4);
      tl.fromTo("#s6-a", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 24.6);
      tl.fromTo("#s6-b", { autoAlpha: 0, y: 34, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 25.3);
      tl.to("#x6", { opacity: 0.13, duration: 1.6, ease: "sine.inOut" }, 25.9);

      window.__timelines["coldchain02"] = tl;
    </script>
  </body>
</html>
