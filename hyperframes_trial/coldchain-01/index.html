<!doctype html>
<html lang="zh-Hant" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>你家冰箱凍不出這種魚</title>
    <link rel="stylesheet" href="shared/brand.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/brand.js"></script>
    <style>
      /* 溫度尺：750px 對應 0°C～−20°C ⇒ y = |溫度|/20 × 750
         0°C→0　−1°C→37.5　−5°C→187.5　−18°C→675
         ⚠️ 這些 top 是相對 #scale-wrap，不要填絕對頁面座標 */
      #scale-wrap { position: absolute; left: 0; right: 0; top: 690px; height: 780px; }
      #scale-bar {
        position: absolute; left: 330px; top: 0; width: 26px; height: 750px;
        border-radius: 13px;
        background: linear-gradient(180deg, #2a4d66 0%, #143247 100%);
      }
      #scale-band {
        position: absolute; left: 318px; top: 37px; width: 50px; height: 150px;
        border-radius: 25px; background: var(--cold);
      }
      .tick { position: absolute; left: 386px; font-size: 40px; color: var(--dim); letter-spacing: 0.04em; }
      #band-label {
        position: absolute; left: 386px; top: 90px; font-size: 46px;
        color: var(--gold); letter-spacing: 0.04em;
      }

      .cellgrid { position: absolute; left: 120px; top: 760px; width: 840px; height: 430px; }
      .cell {
        position: absolute; width: 260px; height: 200px; border-radius: 26px;
        border: 5px solid var(--line-idle); background: rgba(122, 190, 226, 0.05);
      }

      .drop {
        position: absolute; width: 18px; height: 26px;
        border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: var(--cold);
      }
      #bigcell {
        position: absolute; left: 280px; top: 720px; width: 520px; height: 380px;
        border-radius: 44px; border: 6px solid var(--warn); background: rgba(206, 106, 74, 0.07);
      }
      #crack { position: absolute; left: 280px; top: 720px; width: 520px; height: 380px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35.5"
      data-fps="24"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="35.5" data-track-index="0"></div>

      <!-- 1. HOOK 0–3：第一格＝Shorts 縮圖，開場即完整可讀 -->
      <section id="s1" class="clip" data-start="0" data-duration="4.2" data-track-index="1">
        <div class="sin" id="s1-in">
          <div class="xtal" id="x1" style="left: 240px; top: 480px; width: 600px; height: 600px; opacity: 0.22"></div>
          <div class="stack" id="s1-text" style="top: 800px">
            <span class="line l-hook">你家冰箱</span>
            <span class="line l-hook gold">凍不出這種魚</span>
          </div>
          <div class="tag" id="s1-tag" style="top: 1180px">急 凍 的 真 相</div>
        </div>
      </section>

      <!-- 2. ZONE 3–6.5 -->
      <section id="s2" class="clip" data-start="4.2" data-duration="9.1" data-track-index="2">
        <div class="sin" id="s2-in">
          <div class="stack" id="s2-top" style="top: 380px">
            <span class="line l-body">水在 −1°C 到 −5°C 之間結冰</span>
          </div>
          <div id="scale-wrap">
            <div id="scale-bar"></div>
            <div id="scale-band"></div>
            <div class="tick" style="top: -22px">0°C</div>
            <div class="tick" style="top: 655px">−18°C</div>
            <div id="band-label">最大冰晶生成帶</div>
          </div>
          <div class="stack" id="s2-bottom" style="top: 1560px">
            <span class="line l-body cold">八成的水分</span>
            <span class="line l-body cold">都在這裡變成冰晶</span>
          </div>
        </div>
      </section>

      <!-- 3. SLOW 6.5–11.5 -->
      <section id="s3" class="clip" data-start="13.3" data-duration="5.9" data-track-index="3">
        <div class="sin" id="s3-in">
          <div class="tag warn" id="s3-tag" style="top: 420px">慢 慢 通 過 這 一 段</div>
          <div class="cellgrid" id="grid-slow"></div>
          <div class="stack" id="s3-text" style="top: 1340px">
            <span class="line l-body">冰晶就長得又大又尖</span>
            <span class="line l-body warn">撐破細胞</span>
          </div>
        </div>
      </section>

      <!-- 4. FAST 11.5–16 -->
      <section id="s4" class="clip" data-start="19.2" data-duration="5.7" data-track-index="4">
        <div class="sin" id="s4-in">
          <div class="tag" id="s4-tag" style="top: 420px">快 速 通 過</div>
          <div class="cellgrid" id="grid-fast"></div>
          <div class="stack" id="s4-text" style="top: 1340px">
            <span class="line l-body">冰晶細小</span>
            <span class="line l-body cold">細胞保持完整</span>
          </div>
        </div>
      </section>

      <!-- 5. DRIP 16–20 -->
      <section id="s5" class="clip" data-start="24.9" data-duration="5.7" data-track-index="5">
        <div class="sin" id="s5-in">
          <div class="tag warn" id="s5-tag" style="top: 460px">細 胞 破 了</div>
          <div id="bigcell"></div>
          <div id="crack"></div>
          <div id="drops"></div>
          <div class="stack" id="s5-text" style="top: 1440px">
            <span class="line l-body">解凍時</span>
            <span class="line l-body warn">鮮味隨著水流走</span>
          </div>
        </div>
      </section>

      <!-- 6. END 20–24 -->
      <section id="s6" class="clip" data-start="30.6" data-duration="4.9" data-track-index="6">
        <div class="sin" id="s6-in">
          <div class="xtal" id="x6" style="left: 340px; top: 560px; width: 400px; height: 400px; opacity: 0.3"></div>
          <div class="stack" id="s6-a" style="top: 940px">
            <span class="line l-body dim">急凍不是凍得更冷</span>
          </div>
          <div class="stack" id="s6-b" style="top: 1090px">
            <span class="line l-hook gold">是凍得更快</span>
          </div>
        </div>
      </section>

      <!-- 旁白：zh-TW-YunJheNeural +8%，逐字沿用字卡內容 -->
      <audio id="vo-1" data-start="0.25" data-duration="3.62" src="audio/s1.mp3"></audio>
      <audio id="vo-2" data-start="4.45" data-duration="8.5" src="audio/s2.mp3"></audio>
      <audio id="vo-3" data-start="13.55" data-duration="5.28" src="audio/s3.mp3"></audio>
      <audio id="vo-4" data-start="19.45" data-duration="5.09" src="audio/s4.mp3"></audio>
      <audio id="vo-5" data-start="25.15" data-duration="5.09" src="audio/s5.mp3"></audio>
      <audio id="vo-6" data-start="30.85" data-duration="4.34" src="audio/s6.mp3"></audio>
    </div>

    <script>
      brandChrome("bg");
      document.getElementById("x1").innerHTML = crystalMarkup(2.4);
      document.getElementById("x6").innerHTML = crystalMarkup(3);

      function buildGrid(host, xtalSize, xtalWidth, color) {
        for (let i = 0; i < 6; i++) {
          const col = i % 3, row = (i / 3) | 0;
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.style.left = col * 290 + "px";
          cell.style.top = row * 230 + "px";
          host.appendChild(cell);

          const x = document.createElement("div");
          x.className = "xtal";
          x.style.left = col * 290 + (260 - xtalSize) / 2 + "px";
          x.style.top = row * 230 + (200 - xtalSize) / 2 + "px";
          x.style.width = xtalSize + "px";
          x.style.height = xtalSize + "px";
          x.style.color = color;
          x.innerHTML = crystalMarkup(xtalWidth);
          host.appendChild(x);
        }
      }
      buildGrid(document.getElementById("grid-slow"), 190, 3.4, "#ce6a4a");
      buildGrid(document.getElementById("grid-fast"), 62, 3, "#7abee2");

      document.getElementById("crack").innerHTML =
        '<svg viewBox="0 0 520 380" width="100%" height="100%">' +
        '<path id="crack-path" d="M 40 372 L 96 292 L 62 232 L 128 168 L 104 96 L 176 34" ' +
        'stroke="#ce6a4a" stroke-width="7" fill="none" stroke-linecap="round" ' +
        'stroke-linejoin="round" stroke-dasharray="620" stroke-dashoffset="620"/></svg>';

      const dropsHost = document.getElementById("drops");
      for (let i = 0; i < 9; i++) {
        const d = document.createElement("div");
        d.className = "drop";
        d.style.left = 318 + i * 52 + "px";
        d.style.top = 1090 + (i % 3) * 14 + "px";
        dropsHost.appendChild(d);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 1. HOOK：t=0 就要完整可讀
      tl.fromTo("#x1", { rotation: -6, scale: 0.94 }, { rotation: 6, scale: 1.06, duration: 4.2, ease: "none" }, 0);
      tl.fromTo("#s1-text", { scale: 1 }, { scale: 1.045, duration: 4.2, ease: "none" }, 0);
      tl.fromTo("#s1-tag", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.5);
      tl.to("#s1-in", { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.85);
      tl.set("#s1-in", { opacity: 0 }, 4.2);

      // 2. ZONE
      tl.fromTo("#s2-top", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 4.25);
      tl.fromTo("#scale-bar", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 4.5);
      tl.fromTo(".tick", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, stagger: 0.12 }, 5.1);
      tl.fromTo("#scale-band", { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 0%" }, { autoAlpha: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 5.5);
      tl.fromTo("#band-label", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out" }, 5.75);
      tl.to("#scale-band", { opacity: 0.55, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 6);
      tl.fromTo("#s2-bottom", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.2);
      tl.to("#s2-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 13);
      tl.set("#s2-in", { opacity: 0 }, 13.3);

      // 3. SLOW：冰晶長大撐破細胞
      tl.fromTo("#s3-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 13.4);
      tl.fromTo("#grid-slow .cell", { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.5, stagger: 0.06, ease: "power2.out" }, 13.6);
      tl.fromTo("#grid-slow .xtal", { scale: 0.12, rotation: -25, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 2.6, stagger: 0.12, ease: "power1.inOut" }, 14.2);
      tl.to("#grid-slow .cell", { borderColor: "#ce6a4a", duration: 0.5, stagger: 0.1 }, 16.2);
      tl.fromTo("#grid-slow .cell", { scale: 1 }, { scale: 1.06, duration: 0.35, stagger: 0.1, ease: "back.out(3)" }, 16.2);
      tl.fromTo("#s3-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 15.4);
      tl.to("#s3-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 18.9);
      tl.set("#s3-in", { opacity: 0 }, 19.2);

      // 4. FAST：小冰晶瞬間出現，細胞完好
      tl.fromTo("#s4-tag", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 19.3);
      tl.fromTo("#grid-fast .cell", { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.3, stagger: 0.04, ease: "power2.out" }, 19.45);
      tl.fromTo("#grid-fast .xtal", { scale: 0.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, stagger: 0.05, ease: "power3.out" }, 20.1);
      tl.to("#grid-fast .cell", { borderColor: "#7abee2", duration: 0.6 }, 20.7);
      tl.fromTo("#s4-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 20.9);
      tl.to("#s4-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 24.6);
      tl.set("#s4-in", { opacity: 0 }, 24.9);

      // 5. DRIP
      tl.fromTo("#s5-tag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 25);
      tl.fromTo("#bigcell", { autoAlpha: 0, scale: 0.92 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 25.1);
      tl.to("#crack-path", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 25.7);
      tl.fromTo("#drops .drop", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, stagger: 0.04 }, 26.1);
      tl.to("#drops .drop", { y: 620, autoAlpha: 0, duration: 1.6, stagger: 0.07, ease: "power2.in" }, 26.7);
      tl.fromTo("#s5-text", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 26.7);
      tl.to("#s5-in", { opacity: 0, duration: 0.3, ease: "power1.in" }, 30.3);
      tl.set("#s5-in", { opacity: 0 }, 30.6);

      // 6. END
      tl.fromTo("#x6", { scale: 0.7, rotation: -12 }, { scale: 1, rotation: 0, duration: 1.2, ease: "power3.out" }, 30.7);
      tl.fromTo("#s6-a", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power2.out" }, 30.9);
      tl.fromTo("#s6-b", { autoAlpha: 0, y: 34, scale: 0.9 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 31.6);
      tl.to("#x6", { opacity: 0.14, duration: 1.6, ease: "sine.inOut" }, 32.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
