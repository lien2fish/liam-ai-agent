name: YouTube 頻道每日表現日報

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 00:33 = 台灣 08:33）。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run channel report
        env:
          YT_API_KEY:          ${{ secrets.YT_API_KEY }}
          YT_REPORT_HANDLE:    'UnknownHourCosmos'
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python youtube_auto/daily_report.py

      - name: Commit report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/yt頻道日報_*.md youtube_auto/report_state.json
          git diff --staged --quiet || git commit -m "YouTube 頻道日報 $(date +%F)"
          git pull --rebase --autostash   # 多支任務同時跑會搶 push，不先 rebase 就會有人失敗
          git push
