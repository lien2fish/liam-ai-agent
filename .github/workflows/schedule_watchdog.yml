name: 排程巡邏（沒跑就補）

on:
  # 🕐 2026-08-29 退休。它讀各 workflow 的 cron 來判斷「今天誰該跑」，
  # 而全部任務的計時已搬到 Cloudflare Worker `liam-scheduler`，這裡再也讀不到任何 cron，
  # 跑起來只會印「沒有 cron，跳過」。稽核改由 Worker 自己做（UTC 02:30 與 12:30 兩輪）。
  #
  # 保留 workflow_dispatch 是為了留一條後路：哪天決定把某些任務搬回 GitHub schedule，
  # 這支不必重寫就能再用。
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 檢查今天該跑的有沒有跑
        env:
          # workflow_dispatch 與 repository_dispatch 是「GITHUB_TOKEN 觸發的事件
          # 不會產生新 run」這條規則的明文例外，所以內建 token 加 actions:write 就夠，
          # 不需要另外放一把 PAT 進來。
          GH_TOKEN:           ${{ github.token }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_NOTIFY_URL:    ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_TOKEN:  ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python3 scripts/schedule_watchdog.py
