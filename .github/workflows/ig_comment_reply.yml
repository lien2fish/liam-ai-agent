name: IG 留言自動回覆

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分。⚠️ 原本 */5 每天該跑 288 次、實測只跑到 24 次，
      #                       整個 repo 的排程在 2026-08-27 一起被降到幾乎不觸發，
      #                       高頻排程是最可疑的原因。不要改回 */5。
  workflow_dispatch:         # 允許手動觸發

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 還原留言狀態快取
        uses: actions/cache@v4
        with:
          path: instagram/auto_reply/reply_state.json
          key: ig-reply-state-${{ github.run_id }}
          restore-keys: |
            ig-reply-state-

      - name: 執行自動回覆
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_ID:      ${{ secrets.IG_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 instagram/auto_reply/ig_comment_reply.py
