name: IG 留言自動回覆

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（每 30 分鐘（Worker 在每個 :00 與 :30 觸發））。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
      #                       整個 repo 的排程在 2026-08-27 一起被降到幾乎不觸發，
      #                       高頻排程是最可疑的原因。不要改回 */5。
  workflow_dispatch:         # 允許手動觸發

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 還原留言狀態快取
        uses: actions/cache@v4
        with:
          path: instagram/auto_reply/reply_state.json
          key: ig-reply-state-${{ github.run_id }}
          restore-keys: |
            ig-reply-state-

      - name: 執行自動回覆
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_ID:      ${{ secrets.IG_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 instagram/auto_reply/ig_comment_reply.py
