name: 產險保單到期提醒

on:
# ⛔ 計時已於 2026-08-28 搬到 Cloudflare Worker `liam-scheduler`。
#    這裡刻意不留 schedule——兩邊都留會一天觸發兩次，
#    daily_post 會變成發兩則限動，而 IG 發出去 API 刪不掉。
#    要改時間去 scheduler_worker/（worker.js 的 SCHEDULE ＋ wrangler.toml 的 crons，兩邊都要改）。
#    要搬回來就先把 Worker 那邊的時段拿掉，再把 cron 加回這裡。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 檢查即將到期保單
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 insurance/policy_expiry_check.py

      - name: Commit 報告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/產險到期提醒_*.md
          git diff --staged --quiet || git commit -m "chore: 產險到期提醒 $(date +%Y-%m-%d)"
          git pull --rebase --autostash   # 多支任務同時跑會搶 push，不先 rebase 就會有人失敗
          git push
