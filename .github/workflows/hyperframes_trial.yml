name: HyperFrames 試算（手動）

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 渲染品質
        type: choice
        options: [high, draft]
        default: high

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: coldchain-01
            snaps: 1.5,4.7,9,13.7,18,22
          - project: coldchain-02
            snaps: 1.6,5.2,9.5,14.5,18.7,23
          - project: vessel-01
            snaps: 1.6,5.5,9.9,14.8,19.4,23.5
          - project: vessel-02
            snaps: 1.7,5.5,9.9,14.3,18.6,23.3

    defaults:
      run:
        working-directory: hyperframes_trial/${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 中文字型：runner 預設沒有 CJK，缺了會整片變豆腐
      - name: 安裝 ffmpeg 與中文字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          fc-list :lang=zh-tw family | sort -u | head

      # vessel-02 的 NASA 衛星影像放私人 repo（沿用授權配樂的既有做法）
      - name: 取衛星影像素材
        if: matrix.project == 'vessel-02'
        uses: actions/checkout@v4
        with:
          repository: lien2fish/liam-workspace
          token: ${{ secrets.WORKSPACE_PAT }}
          path: _workspace

      - name: 放進專案
        if: matrix.project == 'vessel-02'
        run: |
          mkdir -p assets
          cp "$GITHUB_WORKSPACE/_workspace/assets/knowledge/nasa_malvinas_lights.jpg" assets/
          ls -la assets/

      # shared/ 與 vendor/ 是唯一來源，各專案內的副本沒進版控
      - name: 同步共用檔
        working-directory: hyperframes_trial
        run: ./sync.sh

      - name: 準備 Chrome 與關閉 telemetry
        run: |
          npx --yes hyperframes@0.8.30 telemetry disable
          npx --yes hyperframes@0.8.30 browser ensure
          npx --yes hyperframes@0.8.30 doctor --json > doctor.json
          # doctor 的頂層 .ok 會被選配套件（MusicGen／Whisper）拉成 false，
          # 只卡渲染真正需要的三項
          node -e "
            const d = JSON.parse(require('fs').readFileSync('doctor.json','utf8'));
            const need = ['Chrome', 'FFmpeg', 'FFprobe'];
            const bad = d.checks.filter(c => need.includes(c.name) && !c.ok);
            for (const c of d.checks.filter(c => need.includes(c.name))) console.log(c.name, c.ok, c.detail);
            if (bad.length) { console.error('缺少必要元件：' + bad.map(c => c.name).join(', ')); process.exit(1); }
          "

      - name: check（lint + runtime + 版面 + 對比）
        run: npx --yes hyperframes@0.8.30 check --snapshots

      - name: 各場景中點抽格
        run: npx --yes hyperframes@0.8.30 snapshot --at ${{ matrix.snaps }}

      - name: 渲染
        run: npx --yes hyperframes@0.8.30 render --quality ${{ inputs.quality }} --output out.mp4

      - name: 對齊產線規格（補靜音軌／清色彩標記／對齊 timescale）
        run: |
          # reel_maker 成品規格＝1080x1920 / 24fps / yuv420p(tv) / High@4.0 /
          # aac 48000 stereo / 12288 tbn。reel_outro.py 的 append 用 -c:v copy，
          # 正片必須本來就對齊，否則片尾會被靜默丟掉（實測過：ffmpeg 回 0、
          # 印 ✅、但成品長度沒變）。
          ffmpeg -hide_banner -bsfs | tr ' ' '\n' | grep -qx h264_metadata \
            || { echo '這台 ffmpeg 沒有 h264_metadata bsf，無法無損清色彩標記'; exit 1; }
          ffmpeg -y -v error -i out.mp4 \
            -f lavfi -i anullsrc=r=48000:cl=stereo -shortest \
            -c:v copy \
            -bsf:v "h264_metadata=colour_primaries=2:transfer_characteristics=2:matrix_coefficients=2" \
            -color_primaries unspecified -color_trc unspecified -colorspace unspecified \
            -c:a aac -ar 48000 -ac 2 \
            -video_track_timescale 12288 -movflags +faststart \
            out_pipeline.mp4

      - name: 驗收產出
        run: |
          test -s out.mp4 && test -s out_pipeline.mp4

          # 視訊必須零重編：比對視訊位元流 md5
          a=$(ffmpeg -v error -i out.mp4          -map 0:v -c copy -f md5 - | tr -d '\r')
          b=$(ffmpeg -v error -i out_pipeline.mp4 -map 0:v -c copy -f md5 - | tr -d '\r')
          echo "視訊位元流 before=$a after=$b"
          [ "$a" = "$b" ] || { echo '❌ 視訊被重編了'; exit 1; }

          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of default=noprint_wrappers=1 out_pipeline.mp4

          # 逐項卡規格，對不上就讓 run 變紅
          probe() { ffprobe -v error -select_streams "$1" -show_entries stream="$2" -of csv=p=0 out_pipeline.mp4; }
          [ "$(probe v:0 r_frame_rate)" = "24/1" ]  || { echo '❌ fps 不是 24'; exit 1; }
          [ "$(probe v:0 width),$(probe v:0 height)" = "1080,1920" ] || { echo '❌ 解析度不對'; exit 1; }
          [ "$(probe a:0 codec_name)" = "aac" ]     || { echo '❌ 沒有 aac 音軌'; exit 1; }
          [ "$(probe a:0 sample_rate)" = "48000" ]  || { echo '❌ 取樣率不是 48000'; exit 1; }
          [ "$(probe a:0 channels)" = "2" ]         || { echo '❌ 不是 stereo'; exit 1; }
          echo "✅ ${{ matrix.project }} 已對齊 reel_maker 規格"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.project }}
          path: |
            hyperframes_trial/${{ matrix.project }}/out.mp4
            hyperframes_trial/${{ matrix.project }}/out_pipeline.mp4
            hyperframes_trial/${{ matrix.project }}/snapshots/**
            hyperframes_trial/${{ matrix.project }}/doctor.json
          if-no-files-found: warn
