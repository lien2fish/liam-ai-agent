name: IG 限動 Reels 預告

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 10:08 = 台灣 18:08）。
  # GitHub 的 schedule 把這支延遲了 10~11 小時（8/27、8/28 兩天都在台灣凌晨才發），
  # 而它的意義就是「Reels 18:00 發完，18:08 用限動導流」，遲到等於失效。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天發兩則限動，IG 發出去 API 刪不掉。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略重複觸發防呆，強制執行'
        type: boolean
        default: false

jobs:
  # 🔴 Cloudflare 自 2026-10-12 起會把同一個 cron 事件送兩次（10/13 實測整天都是兩倍），
  # 而 IG 限動發出去 API 刪不掉。這個 job 擋掉同一天第二次之後的觸發。
  # 判斷用 run_id 比大小，不看前一次跑完沒有——兩次只差幾十秒，等狀態會有競態。
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::force=true，略過重複觸發防呆"
            exit 0
          fi
          n=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ig_story_teaser.yml/runs?created=$(date -u +%F)&per_page=100" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length")
          if [ "$n" -gt 0 ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice::今天已經有 $n 次更早的觸發，這次跳過（Cloudflare 重複送 cron）"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  teaser:
    needs: guard
    if: needs.guard.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -fv

      - name: Install Python dependencies
        run: pip install Pillow numpy

      - name: Build and publish story teaser
        env:
          IG_TOKEN:     ${{ secrets.IG_TOKEN }}
          IG_ID:        ${{ secrets.IG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 instagram/story_teaser.py

      - name: Commit selection state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 影片由腳本經 API 直接推上 main，這裡只記錄「哪支用過」
          git add instagram/story_teaser_state.json
          git diff --staged --quiet || git commit -m "chore(ig): 更新限動預告選片紀錄"
          # ⚠️ pull 與 push 之間還有窗口讓別支任務插進來——2026-08-29 實測就中了：
          # pull 回報 up to date，下一行 push 就被 rejected。所以要重試，不是 pull 一次就好。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::連 5 次都沒推上去"; exit 1
