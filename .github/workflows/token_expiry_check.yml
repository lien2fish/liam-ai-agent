name: Token 到期提醒

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 00:47 = 台灣 08:47）。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 IG／FB Token
        env:
          IG_TOKEN:           ${{ secrets.IG_TOKEN }}
          IG_ID:              ${{ secrets.IG_ID }}
          FB_PAGE_TOKEN:      ${{ secrets.FB_PAGE_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_NOTIFY_URL:    ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_TOKEN:  ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python3 scripts/token_expiry_check.py
