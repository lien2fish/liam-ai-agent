name: 每日股市分析報告

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 04:07 = 台灣 12:07）。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 還原歷史記錄快取
        uses: actions/cache@v4
        with:
          path: market/market_history.json
          key: market-history-${{ github.run_id }}
          restore-keys: |
            market-history-

      - name: 執行每日市場分析
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_KEY:   ${{ secrets.GEMINI_KEY }}
        run: python3 market/market_report.py

      - name: 產生 PDF 報告
        run: |
          pip install reportlab
          rm -f day/市場日報_*.pdf
          python3 scripts/md_to_pdf.py "day/市場日報_$(date +%Y-%m-%d).pdf" "reports/市場日報_$(date +%Y-%m-%d).md"

      - name: Commit 報告與歷史記錄
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market/market_config.json market/market_history.json day/
          git add "reports/市場日報_$(date +%Y-%m-%d).md" 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 市場日報 $(date +%Y-%m-%d)"
          # ⚠️ pull 與 push 之間還有窗口讓別支任務插進來——2026-08-29 實測就中了：
          # pull 回報 up to date，下一行 push 就被 rejected。所以要重試，不是 pull 一次就好。
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::連 5 次都沒推上去"; exit 1
