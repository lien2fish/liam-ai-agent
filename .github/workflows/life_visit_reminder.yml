name: 壽險客戶固定拜訪提醒

on:
# ⛔ 計時已於 2026-08-28 搬到 Cloudflare Worker `liam-scheduler`。
#    這裡刻意不留 schedule——兩邊都留會一天觸發兩次，
#    daily_post 會變成發兩則限動，而 IG 發出去 API 刪不掉。
#    要改時間去 scheduler_worker/（worker.js 的 SCHEDULE ＋ wrangler.toml 的 crons，兩邊都要改）。
#    要搬回來就先把 Worker 那邊的時段拿掉，再把 cron 加回這裡。
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run visit reminder
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          VISIT_REMINDER_DAYS: '7'
        run: python insurance/visit_reminder.py
