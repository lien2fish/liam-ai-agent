name: YouTube 每日自動影片

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 02:07 = 台灣 10:07）。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 55    # 長片日會同時產 Shorts + 長片兩支，需較長時間
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 配樂放私人 repo：YouTube 音樂庫的授權涵蓋「用在自己的影片裡」，
      # 不包含把音檔當獨立檔案散布，所以不能放公開 repo
      - name: Checkout private assets
        uses: actions/checkout@v4
        with:
          repository: lien2fish/liam-workspace
          token: ${{ secrets.WORKSPACE_PAT }}
          path: workspace

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - name: Install Python dependencies
        run: pip install edge-tts requests Pillow

      - name: Generate and upload Short
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:          ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY:              ${{ secrets.GEMINI_KEY }}   # Claude 不可用時的腳本備援
          HF_TOKEN:                ${{ secrets.HF_TOKEN }}
          YT_OAUTH_CLIENT_ID:      ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET:  ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_OAUTH_REFRESH_TOKEN:  ${{ secrets.YT_OAUTH_REFRESH_TOKEN }}
          YT_BGM:                  workspace/assets/bgm/night_music.mp3
          YT_PRIVACY:              'private'
          YT_PUBLISH_HOUR:         '18'        # 台灣時間18:00自動轉公開（排程發布）
          # 實際排程在 make_and_upload.py：SHORT_WEEKDAYS={1,4} 週二、五；LONG_WEEKDAYS={6} 週日。
          # 可設 YT_FORMAT=long/short 覆寫只產一支
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:             ${{ github.repository }}
        run: python youtube_auto/make_and_upload.py
