name: 回購提醒

on:
# ⛔ 計時已於 2026-08-28 搬到 Cloudflare Worker `liam-scheduler`。
#    這裡刻意不留 schedule——兩邊都留會一天觸發兩次，
#    daily_post 會變成發兩則限動，而 IG 發出去 API 刪不掉。
#    要改時間去 scheduler_worker/（worker.js 的 SCHEDULE ＋ wrangler.toml 的 crons，兩邊都要改）。
#    要搬回來就先把 Worker 那邊的時段拿掉，再把 cron 加回這裡。
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repurchase reminder
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          REPURCHASE_DAYS:     '60'
        run: python crm_unified/repurchase_reminder.py

      # ⚠️ 刻意不 commit 報告。報告含客戶姓名與手機，repo 為 public。
      # 與 life_visit_reminder／birthday_reminder／weekly_revenue_sprint 一致：客戶個資只走 Email。
      # （2026-08-21 修：原本每天自動 commit，已累積 56 份含個資的報告在公開 repo。）
