name: 回購提醒

on:
  schedule:
    - cron: '0 1 * * *'    # UTC 01:00 = 台灣時間 09:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run repurchase reminder
        env:
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          REPURCHASE_DAYS:     '60'
        run: python crm_unified/repurchase_reminder.py

      # ⚠️ 刻意不 commit 報告。報告含客戶姓名與手機，repo 為 public。
      # 與 life_visit_reminder／birthday_reminder／weekly_revenue_sprint 一致：客戶個資只走 Email。
      # （2026-08-21 修：原本每天自動 commit，已累積 56 份含個資的報告在公開 repo。）
