name: Gmail 自動化（清理 + 新聞摘要）

on:
  # 🕐 計時已於 2026-08-29 搬到 Cloudflare Worker `liam-scheduler`（UTC 00:13 = 台灣 08:13）。
  # GitHub 的 schedule 誤點嚴重（實測延遲中位 37~689 分，最糟 23 小時），
  # 全部任務改由 Worker 定時 dispatch，GitHub 只負責執行。
  # ⛔ 不要把 cron 加回來——兩邊都留會一天觸發兩次。
  workflow_dispatch:        # 允許手動觸發

jobs:
  gmail-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 新聞摘要（08:00）
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python3 gmail_news_digest.py

      - name: Gmail 清理（08:05）
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python3 gmail_monthly_cleanup.py

      - name: 產生 PDF 報告
        run: |
          pip install reportlab
          rm -f day/gmail日報_*.pdf
          python3 scripts/md_to_pdf.py "day/gmail日報_$(date +%Y-%m-%d).pdf" 今日新聞摘要.md reports/gmail_cleanup_$(date +%Y-%m).md

      - name: Commit 報告到 repo
        run: |
          git config user.name  "Liam AI Agent"
          git config user.email "lien2fish@gmail.com"
          git add reports/ 今日新聞摘要.md day/
          git diff --cached --quiet || git commit -m "chore: 自動更新 Gmail 報告 $(date '+%Y-%m-%d')"
          git pull --rebase
          git push
