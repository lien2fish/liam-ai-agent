name: 每日海鮮限時動態

on:
# ⛔ 計時已於 2026-08-28 搬到 Cloudflare Worker `liam-scheduler`。
#    這裡刻意不留 schedule——兩邊都留會一天觸發兩次，
#    daily_post 會變成發兩則限動，而 IG 發出去 API 刪不掉。
#    要改時間去 scheduler_worker/（worker.js 的 SCHEDULE ＋ wrangler.toml 的 crons，兩邊都要改）。
#    要搬回來就先把 Worker 那邊的時段拿掉，再把 cron 加回這裡。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略重複觸發防呆，強制執行'
        type: boolean
        default: false

jobs:
  # 🔴 Cloudflare 自 2026-10-12 起會把同一個 cron 事件送兩次（10/13 實測整天都是兩倍），
  # 而 IG 限動發出去 API 刪不掉。這個 job 擋掉同一天第二次之後的觸發。
  # 判斷用 run_id 比大小，不看前一次跑完沒有——兩次只差幾十秒，等狀態會有競態。
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::force=true，略過重複觸發防呆"
            exit 0
          fi
          n=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/daily_post.yml/runs?created=$(date -u +%F)&per_page=100" \
            --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length")
          if [ "$n" -gt 0 ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
            echo "::notice::今天已經有 $n 次更早的觸發，這次跳過（Cloudflare 重複送 cron）"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: guard
    if: needs.guard.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 生圖重試最壞約 9 分；影片日還要配音、算圖、等 IG 轉檔（最多 3 分）
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chinese fonts + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          fc-cache -fv

      - name: Install Python dependencies
        run: pip install Pillow requests numpy edge-tts

      - name: Run daily post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_NOTIFY_URL:   ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_KEY:   ${{ secrets.GEMINI_KEY }}
          HF_TOKEN:     ${{ secrets.HF_TOKEN }}
          IG_TOKEN:     ${{ secrets.IG_TOKEN }}
          IG_ID:        ${{ secrets.IG_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:    ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:  ${{ github.repository }}
        run: python instagram/generate_post.py
