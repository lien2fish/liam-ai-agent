name = "liam-assistant"
main = "worker.js"
compatibility_date = "2026-08-18"

# LINE webhook 指向 .workers.dev 網址，明確鎖住不要靠 Cloudflare 的預設值——
# 預設哪天改掉，網址會直接消失，而 LINE 只會顯示 webhook 失敗、不說原因。
workers_dev = true

# 只保留正式網址當入口，不額外開預覽網址（簽章擋得住，但沒必要多開一個門）。
preview_urls = false

# 對話記憶（最近幾輪，TTL 1 小時）。用 `wrangler kv namespace create CHAT` 產生後貼回 id。
[[kv_namespaces]]
binding = "CHAT"
id = "ea20117389c24e38b9f1512582733966"

[vars]
# ⚠️ LINE_USER_ID 不寫在這裡——這個 repo 是公開的，user ID 是綁在本人身上的識別碼。
# 改用 wrangler secret put LINE_USER_ID（見下方清單）。
# 沒設定時程式會擋掉所有人（fail closed），不會誤放行。

# 換模型只改這一行。成本與能力差異見 README。
# effort 參數由 worker.js 依模型自動開關，換模型不必改別的地方。
MODEL = "claude-haiku-4-5"

# Notion 資料庫 ID。變數名稱要跟 profile.js 裡 crm.*.db 與 inventory[].db 對得上。
# 沒有 Notion 就整段刪掉，profile.js 的 crm 設 null、inventory 設 []，功能會自動關閉。
CUSTOMER_DB = "38bf4149-a6aa-816e-9850-f3dfbbb925ec"
SALES_DB = "38bf4149-a6aa-81db-9b89-c47410857a2c"
INV_WINE_DB = "3abf4149-a6aa-8104-8d98-fe75f7f367a5"
INV_TEA_DB = "3abf4149-a6aa-8124-835e-fbaf09d673eb"
INV_SEAFOOD_DB = "3abf4149-a6aa-8111-b29a-d92909d6962c"

# 金鑰不寫在這裡，用 wrangler secret put：
#   ANTHROPIC_API_KEY     Claude 對話
#   OPENAI_API_KEY        語音轉文字（Whisper）
#   NOTION_TOKEN          查客戶／銷售／庫存
#   GITHUB_PAT            寫 liam-workspace 的 TODO 與知識庫（需 repo scope）
#   LINE_USER_ID          ⚠️ 白名單，只有這個人能用（Console → Basic settings → Your user ID）
#
# ⚠️ wrangler secret put 一定要在真正的終端機跑。在沒有互動 TTY 的環境
#    （例如 Claude Code 的對話框）它會讀到空值、存成空字串，然後照樣印
#    「✨ Success」。非互動要灌就用：
#      printf '%s' "$(tr -d '\r\n' < 金鑰檔)" | npx wrangler secret put NAME
#   LINE_CHANNEL_SECRET   驗 webhook 簽章（LINE Developers Console → Basic settings）
#   LINE_ACCESS_TOKEN     發訊息用的 long-lived channel access token（Messaging API 分頁）
#   NOTIFY_TOKEN          GitHub Actions 推播用，自己隨便產一串
#
# ⚠️ 這個 repo 是公開的。以上一律走 wrangler secret put，不要寫進任何檔案。
